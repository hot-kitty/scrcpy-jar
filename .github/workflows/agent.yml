name: Build agent jar

# Compiles the minimal Java agent (agent/) against android.jar and turns it
# into a DEX jar with d8, then uploads it as a build artifact. On a v* tag
# it also attaches the jar to a GitHub Release.
#
# Note: do NOT use android-actions/setup-android here — it fails on the
# GitHub-hosted runner because its sdkmanager call looks for the retired
# "tools" package ("Failed to find package 'tools'", exit code 1).
# The runner already ships an Android SDK at /usr/local/lib/android/sdk,
# so this workflow uses that SDK directly.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform and build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/platforms/android-34/android.jar"
          ls "$ANDROID_HOME/build-tools/34.0.0/d8"

      - name: Compile agent
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p out
          javac -cp "$ANDROID_JAR" -d out $(find agent/src -name '*.java')
          mkdir -p dist-agent
          # d8 does not accept the raw class-output directory as input, so
          # pack the classes into a jar first ("Unsupported source file type"
          # if the directory is passed directly).
          jar --create --file agent-classes.jar -C out .
          "$ANDROID_HOME/build-tools/34.0.0/d8" --output dist-agent/panda-kit-replica.jar --lib "$ANDROID_JAR" agent-classes.jar
          ls -lh dist-agent/
          unzip -l dist-agent/panda-kit-replica.jar | head -n 20

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-kit-replica
          path: dist-agent/panda-kit-replica.jar
          if-no-files-found: error

      - name: Attach jar to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-agent/panda-kit-replica.jar
